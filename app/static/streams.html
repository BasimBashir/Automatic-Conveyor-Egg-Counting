<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Egg Counter — Streams</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <span class="logo">EggCounter</span>
        <a href="/">Image</a>
        <a href="/video.html">Video</a>
        <a href="/streams.html" class="active">Streams</a>
    </nav>

    <div class="container">
        <!-- GRID VIEW -->
        <div id="gridView">
            <h1 class="page-title">Streams</h1>
            <p class="page-subtitle">10 fixed slots, batched through one model. Click a tile to configure or watch.</p>

            <div class="stats-panel" style="margin-bottom:16px;">
                <div class="stat"><div class="value green" id="totalCount">0</div><div class="label">Eggs counted (all slots)</div></div>
                <div class="stat"><div class="value amber" id="activeCount">0</div><div class="label">Active streams</div></div>
            </div>

            <div id="grid" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:12px;"></div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detailView" style="display:none;">
            <button class="btn btn-outline" id="btnBack" style="margin-bottom:16px;">← Back to grid</button>
            <h1 class="page-title" id="detailTitle">Slot</h1>

            <div class="feed-container">
                <img id="detailFeed" style="display:none;" alt="Live Feed">
                <span class="feed-placeholder" id="detailPlaceholder">Not connected</span>
            </div>

            <div class="stats-panel">
                <div class="stat"><div class="value green" id="detailEggCount">0</div><div class="label">Eggs Counted</div></div>
                <div class="stat"><div class="value amber" id="detailFps">0</div><div class="label">FPS</div></div>
            </div>

            <div class="card" style="margin-top:16px;">
                <h3 style="margin-bottom:12px; font-size:16px;">Source</h3>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <button class="btn btn-outline active" data-src-tab="rtsp">RTSP</button>
                    <button class="btn btn-outline" data-src-tab="file">Video File</button>
                </div>
                <div id="srcRtsp">
                    <input class="input" id="detailUrl" placeholder="rtsp://user:pass@ip:554/path">
                </div>
                <div id="srcFile" style="display:none;">
                    <input type="file" id="detailFile" accept="video/*">
                    <p class="page-subtitle" id="detailFilename"></p>
                </div>
            </div>

            <div class="card" style="margin-top:16px;">
                <h3 style="margin-bottom:12px; font-size:16px;">Conveyor & ROI</h3>
                <div class="setting-row">
                    <label>Direction</label>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-outline active" data-dir="tb">Top → Bottom</button>
                        <button class="btn btn-outline" data-dir="lr">Left → Right</button>
                    </div>
                </div>
                <div class="setting-row">
                    <label>ROI position</label>
                    <input type="range" id="detailRoi" min="0.05" max="0.95" step="0.01" value="0.7">
                    <span class="range-value" id="detailRoiVal">0.70</span>
                </div>
                <div class="setting-row">
                    <label>Confidence</label>
                    <input type="range" id="detailConf" min="0.05" max="0.95" step="0.01" value="0.25">
                    <span class="range-value" id="detailConfVal">0.25</span>
                </div>
                <div class="setting-row">
                    <label><input type="checkbox" id="detailEnabled"> Enabled on container boot</label>
                </div>
                <div class="setting-row">
                    <label><input type="checkbox" id="detailCountOnStart"> Auto-enable counting on start</label>
                </div>
            </div>

            <div class="controls" style="margin-top:16px;">
                <button class="btn btn-success" id="btnConnect">Connect</button>
                <button class="btn btn-danger" id="btnDisconnect">Disconnect</button>
                <button class="btn btn-primary" id="btnCountStart">Start Counting</button>
                <button class="btn btn-outline" id="btnCountStop">Stop Counting</button>
                <button class="btn btn-outline" id="btnReset">Reset</button>
                <button class="btn btn-primary" id="btnSave" style="margin-left:auto;">Save settings</button>
            </div>
        </div>
    </div>

    <script src="/js/streams.js"></script>
</body>
</html>
